version: 2

# Keeps the three ecosystems this repo actually uses current, and — because CI treats
# NuGet audit warnings as errors — a vulnerable transitive package shows up as a failing
# check with an open PR that fixes it, rather than as a warning nobody reads.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["*"]
    ignore:
      # Microsoft.OpenApi is pinned only to lift the transitive version above
      # GHSA-v5pm-xwqc-g5wc — its major has to track whatever Microsoft.AspNetCore.OpenApi
      # generates against. 3.x makes IOpenApiMediaType.Example read-only while the
      # ASP.NET Core 10 source generator still assigns it, so the major cannot move
      # until that package does. Patches and minors still come through.
      - dependency-name: Microsoft.OpenApi
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8 declares `typescript: >=4.8.4 <6.1.0`. A TS 7 bump cannot
      # install, so proposing it only produces a PR whose CI can never go green.
      # Drop this entry once typescript-eslint widens the peer range.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
